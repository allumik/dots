# Colours are the humanoid-light base16 palette stylix applied on NixOS.
[main]
anchor=right
font=IBM Plex Sans:size=11
vertical-pad=10
horizontal-pad=10
inner-pad=14
lines=24
use-bold=yes
show-actions=yes
icons-enabled=yes
icon-theme=Chicago95
exit-on-keyboard-focus-loss=yes
keyboard-focus=on-demand

[border]
width=2
radius=0
selection-radius=2

[colors]
background=f8f8f2ff
text=232629ff
placeholder=c0c0bdff
prompt=232629ff
input=232629ff
match=ffb627ff
selection=c0c0bdff
selection-text=232629ff
selection-match=ffb627ff
counter=2f3337ff
# matches waybar's border
border=364c40ff
