# Always-on RNNoise denoiser wrapping just the C270 webcam mic: creates a
# "Noise Canceling Source" to use as input instead of the raw webcam.
# The plugin is found through LADSPA_PATH (set by home.scm).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Noise Canceling Source"
      media.name       = "Noise Canceling Source"
      filter.graph = {
        nodes = [
          { type   = ladspa
            name   = rnnoise
            plugin = librnnoise_ladspa
            label  = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50.0 }
          }
        ]
      }
      capture.props = {
        node.name      = "capture.webcam_denoise"
        node.passive   = true
        target.object  = "alsa_input.usb-046d_C270_HD_WEBCAM_200901010001-02.mono-fallback"
      }
      playback.props = {
        node.name  = "rnnoise_source"
        media.class = Audio/Source
      }
    }
  }
]
