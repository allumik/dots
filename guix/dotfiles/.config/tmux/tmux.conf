# What home-manager's programs.tmux options expanded to on NixOS. The
# sensible/yank/open plugins are not packaged in Guix; the sensible settings
# that differ from tmux defaults are inlined, yank is a copy-mode binding.
set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g status-keys vi
setw -g mode-keys vi
set -s escape-time 50
setw -g aggressive-resize on
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

unbind C-BSpace
unbind C-Left
unbind C-Right

# enable vermin
set -g mouse on
set -g extended-keys on

# loud or quiet?
set -g visual-activity on
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# No status bar at all -- it always reserves its own row even with an
# empty/transparent format. The shell prompt shows a [tmux] indicator
# instead (see ~/.config/shell/common.sh), which costs no extra rows.
set -g status off
set -g set-titles-string "tmux: #I #W"

# more intuitive keybindings for splitting
unbind %
bind % split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# break pane into a new window
bind ^ break-pane -d

# Golden-ratio dev layout: left pane (~62%) gets nvim with a netrw
# sidebar, right pane (~38%) is a plain shell for vim-slime's REPL target
bind G split-window -h -p 38 -c "#{pane_current_path}" \; split-window -v -p 38 -c "#{pane_current_path}" \; select-pane -L \; send-keys "nvim -c Lexplore" Enter
