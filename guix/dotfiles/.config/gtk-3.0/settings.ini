[Settings]
# Empty decoration-layout strips close/minimize/maximize from GTK client-side
# title bars, for the apps that ignore niri's request for server-side ones.
gtk-decoration-layout=:
gtk-icon-theme-name=Chicago95
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=16
gtk-font-name=DejaVu Sans 10
