# Inbound policy of the NixOS firewall on deskmeat: drop by default, trust
# the tailnet, open only what deskmeat serves. No forward chain on purpose:
# libvirt's NAT network installs its own rules and needs forwarding.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    iifname "tailscale0" accept
    meta l4proto { icmp, ipv6-icmp } accept
    ip6 saddr fe80::/10 udp dport 546 accept  # DHCPv6 replies

    tcp dport 22 accept                     # sshd
    udp dport 9 accept                      # wake-on-LAN
    tcp dport 1714-1764 accept              # KDE Connect
    udp dport 1714-1764 accept
    tcp dport { 47984, 47989, 47990, 48010 } accept  # Sunshine
    udp dport { 47998-48000, 48002, 48010 } accept
  }
}
